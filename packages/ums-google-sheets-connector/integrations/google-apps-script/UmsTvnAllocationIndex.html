<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body {
        color: #172033;
        font: 14px/1.5 Arial, sans-serif;
        margin: 24px;
      }

      .box {
        border: 1px solid #d8dee9;
        border-radius: 6px;
        padding: 18px;
      }

      .log {
        background: #0f172a;
        border-radius: 4px;
        color: #dbeafe;
        font-family: Consolas, Monaco, monospace;
        margin-top: 14px;
        max-height: 360px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      .ok { color: #15803d; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>UMS - Đồng bộ số lượng cấp phát</h2>
      <p id="status">Đang chuẩn bị dữ liệu đăng ký...</p>
      <div class="log" id="log"></div>
    </div>

    <script>
      const endpoint = '<?= endpoint ?>';
      const token = '<?= token ?>';
      const payload = <?!= payload ?>;
      const totalRows = Number('<?= totalRows ?>') || 0;
      const batchSize = Number('<?= batchSize ?>') || 200;

      function notify(message, status, extra) {
        const data = {
          source: 'ums-sheet-sync',
          message: message,
          status: status || 'info'
        };

        if (extra) {
          data.payload = extra;
        }
        if (window.opener) {
          window.opener.postMessage(data, '*');
        }

        const line = document.createElement('div');
        line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
        document.getElementById('log').appendChild(line);
      }

      function finish(message, status, summary) {
        notify(message, status, summary);
        if (window.opener) {
          window.opener.postMessage({
            source: 'ums-sheet-sync',
            message: message,
            status: status || 'info',
            payload: summary || null,
            done: true
          }, '*');
        }
        window.setTimeout(function () { window.close(); }, 1800);
      }

      async function postBatch(rows, offset, totalItems) {
        const body = Object.assign({}, payload, {
          rows: rows,
          batch_offset: offset,
          batch_size: rows.length,
          finalize: offset + rows.length >= totalItems
        });
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8',
            'X-Sync-Token': token
          },
          body: JSON.stringify(body)
        });
        const text = await response.text();
        let decoded;

        try {
          decoded = JSON.parse(text);
        } catch (error) {
          throw new Error('UMS trả về dữ liệu không hợp lệ. HTTP ' + response.status + ': ' + text);
        }
        if (response.status < 200 || response.status >= 300) {
          throw new Error(decoded.message || ('UMS từ chối dữ liệu. HTTP ' + response.status));
        }
        return decoded;
      }

      async function run() {
        document.getElementById('status').textContent = 'Đang gửi dữ liệu cấp phát về UMS...';
        notify('Đã đọc ' + totalRows + ' dòng đăng ký từ Google Sheet.', 'info');

        const rows = payload.rows || [];
        const summary = { count: 0, failed: 0, preview_url: '' };
        for (let offset = 0; offset < rows.length; offset += batchSize) {
          const batch = rows.slice(offset, offset + batchSize);
          notify('Đang gửi dòng ' + (offset + 1) + '-' + (offset + batch.length) + '...', 'info');
          const result = await postBatch(batch, offset, rows.length);
          summary.count += Number(result.count || 0);
          summary.failed += Number(result.failed || 0);
          summary.preview_url = result.preview_url || summary.preview_url;
          summary.error_count = Number(result.error_count || summary.error_count || 0);
          summary.warning_count = Number(result.warning_count || summary.warning_count || 0);
        }

        document.getElementById('status').innerHTML = '<span class="ok">Đã đọc xong dữ liệu cấp phát.</span>';
        finish('Hoàn tất đọc Google Sheet cấp phát.', summary.error_count > 0 ? 'warning' : 'success', summary);
      }

      run().catch(function (error) {
        notify('Popup không POST trực tiếp được: ' + (error.message || String(error)), 'warning');
        if (window.opener) {
          window.opener.postMessage({
            source: 'ums-sheet-sync',
            action: 'admin-post',
            message: 'Chuyển dữ liệu cấp phát về trang Admin để POST cùng-origin.',
            status: 'warning',
            payload: payload,
            batchSize: batchSize,
            mode: 'allocation',
            done: false
          }, '*');
          document.getElementById('status').innerHTML = '<span class="ok">Đã chuyển dữ liệu về trang Admin.</span>';
          window.setTimeout(function () { window.close(); }, 1200);
          return;
        }

        document.getElementById('status').innerHTML = '<span class="error">Đồng bộ thất bại.</span>';
        finish(error.message || String(error), 'error', null);
      });
    </script>
  </body>
</html>
