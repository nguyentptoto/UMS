<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body {
        color: #172033;
        font: 14px/1.5 Arial, sans-serif;
        margin: 24px;
      }

      .box {
        border: 1px solid #d8dee9;
        border-radius: 6px;
        padding: 18px;
      }

      .log {
        background: #0f172a;
        border-radius: 4px;
        color: #dbeafe;
        font-family: Consolas, Monaco, monospace;
        margin-top: 14px;
        max-height: 360px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
      }

      .ok { color: #15803d; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>UMS Sheet Sync</h2>
      <p id="status">Đang chuẩn bị dữ liệu...</p>
      <div class="log" id="log"></div>
    </div>

    <script>
      const endpoint = '<?= endpoint ?>';
      const token = '<?= token ?>';
      const payload = <?!= payload ?>;
      const totalRows = Number('<?= totalRows ?>') || 0;
      const batchSize = Number('<?= batchSize ?>') || 200;
      const mode = '<?= mode ?>';
      const itemKey = '<?= itemKey ?>';

      function notify(message, status, extra) {
        const data = {
          source: 'ums-sheet-sync',
          message: message,
          status: status || 'info'
        };

        if (extra) {
          data.payload = extra;
        }

        if (window.opener) {
          window.opener.postMessage(data, '*');
        }

        const line = document.createElement('div');
        line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
        document.getElementById('log').appendChild(line);
      }

      function finish(message, status, extra) {
        notify(message, status, extra);
        if (window.opener) {
          window.opener.postMessage({
            source: 'ums-sheet-sync',
            message: message,
            status: status || 'info',
            payload: extra || null,
            done: true
          }, '*');
        }

        window.setTimeout(function () {
          window.close();
        }, 1800);
      }

      async function postBatch(items, offset, totalItems) {
        const body = Object.assign({}, payload, {
          batch_offset: offset,
          batch_size: items.length,
          finalize: mode === 'organization' && offset + items.length >= totalItems
        });
        body[itemKey] = items;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8',
            'X-Sync-Token': token
          },
          body: JSON.stringify(body)
        });

        const text = await response.text();
        let decoded;

        try {
          decoded = JSON.parse(text);
        } catch (error) {
          throw new Error('WordPress trả về dữ liệu không phải JSON. HTTP ' + response.status + ': ' + text);
        }

        if (response.status < 200 || response.status >= 300) {
          throw new Error('WordPress từ chối batch. HTTP ' + response.status + ': ' + JSON.stringify(decoded));
        }

        return decoded;
      }

      async function run() {
        document.getElementById('status').textContent = 'Đang gửi dữ liệu về UMS...';
        notify('Đã đọc ' + totalRows + ' dòng từ Google Sheet.', 'info');

        const total = {
          count: 0,
          created: 0,
          updated: 0,
          failed: 0
        };
        const errors = [];

        const items = payload[itemKey] || [];
        for (let offset = 0; offset < items.length; offset += batchSize) {
          const batch = items.slice(offset, offset + batchSize);
          notify('Đang gửi batch ' + (offset + 1) + '-' + (offset + batch.length) + '...', 'info');

          const result = await postBatch(batch, offset, items.length);
          total.count += Number(result.count || result.summary?.received || 0);
          total.created += Number(result.created || result.summary?.created || 0);
          total.updated += Number(result.updated || result.summary?.updated || 0);
          total.failed += Number(result.failed || result.summary?.failed || 0);
          total.deleted = Number(total.deleted || 0) + Number(result.deleted || 0);

          (result.errors || []).forEach(function (error) {
            errors.push(error);
          });
        }

        const summary = Object.assign({}, total, { errors: errors.slice(0, 20) });
        document.getElementById('status').innerHTML = '<span class="ok">Hoàn tất đồng bộ.</span>';
        finish('Hoàn tất đồng bộ Google Sheet.', total.failed > 0 ? 'warning' : 'success', summary);
      }

      run().catch(function (error) {
        notify('Popup không POST trực tiếp được: ' + (error.message || String(error)), 'warning');

        if (window.opener) {
          window.opener.postMessage({
            source: 'ums-sheet-sync',
            action: 'admin-post',
            message: 'Chuyển dữ liệu về trang Admin để POST cùng-origin.',
            status: 'warning',
            payload: payload,
            batchSize: batchSize,
            mode: mode,
            done: false
          }, '*');

          document.getElementById('status').innerHTML = '<span class="ok">Đã chuyển dữ liệu về trang Admin.</span>';
          window.setTimeout(function () {
            window.close();
          }, 1200);
          return;
        }

        document.getElementById('status').innerHTML = '<span class="error">Đồng bộ thất bại.</span>';
        finish(error.message || String(error), 'error');
      });
    </script>
  </body>
</html>
